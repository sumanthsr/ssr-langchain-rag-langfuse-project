#       name: letsencrypt-prod
#     solvers:
#       - http01:
#           ingress:
#             class: nginx

# ── Production Ingress ────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ingress
  namespace: rag-prod
  labels:
    app: rag-langchain
    environment: prod
  annotations:
    # NGINX Ingress Controller
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "55m"        # match MAX_UPLOAD_SIZE_MB + headroom
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"     # match API timeout
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # Streaming — disable buffering so SSE tokens reach clients immediately
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # Rate limiting (per IP) — adjust for your expected traffic
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    # cert-manager: automatically provision + renew TLS certificate
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  tls:
    - hosts:
        - api.yourdomain.com        # ← replace with your domain
      secretName: rag-tls-cert      # cert-manager writes the TLS cert here
  rules:
    - host: api.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-api-service
                port:
                  number: 80
---
# ── QA Ingress ────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ingress
  namespace: rag-qa
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "55m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    # Basic auth on QA to prevent public access
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: qa-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "QA Environment — Authorised Access Only"
spec:
  rules:
    - host: api-qa.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-api-service
                port:
                  number: 80
