# ═══════════════════════════════════════════════════════════════════
# k8s/secret.yaml — TEMPLATE ONLY
# ═══════════════════════════════════════════════════════════════════
# NEVER commit real secret values to Git.
# In production: use External Secrets Operator to sync from
#   AWS Secrets Manager / HashiCorp Vault / GCP Secret Manager.
#
# For local K8s testing, create secrets manually:
#   kubectl create secret generic rag-secrets \
#     --from-literal=LANGFUSE_PUBLIC_KEY=pk-lf-xxx \
#     --from-literal=LANGFUSE_SECRET_KEY=sk-lf-xxx \
#     --namespace=rag-prod
# ═══════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag-prod       # repeat for rag-qa and rag-dev
  labels:
    app: rag-langchain
type: Opaque
# Values are base64-encoded placeholders — replace with real values
# echo -n "your-value" | base64
stringData:
  LANGFUSE_PUBLIC_KEY: "REPLACE_WITH_REAL_KEY"
  LANGFUSE_SECRET_KEY: "REPLACE_WITH_REAL_KEY"
