# ═══════════════════════════════════════════════════════════════════
# k8s/serviceaccount.yaml — RBAC (least-privilege)
# ═══════════════════════════════════════════════════════════════════
# The API pod gets a dedicated ServiceAccount with no cluster permissions.
# Principle of least privilege: pods should not inherit default SA credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-api-sa
  namespace: rag-prod
  labels:
    app: rag-langchain
  annotations:
    # If using IRSA (AWS) or Workload Identity (GCP), attach the IAM role here:
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/rag-api-role
automountServiceAccountToken: false   # opt-in only — no token unless needed
